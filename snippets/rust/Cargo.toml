[package]
name = "lingara-apps-snippets"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false
description = "The Rust snippets the Lingara apps docs show, each a complete program"

[dependencies]
axum = "0.8"
lingara-apps = { path = "../../rust", features = ["axum"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
