name: CI

# Ships with the public repository, so it invokes only make targets the
# shipped make files define, checks out no submodule, and reads no secret
# (ADR 30.9.26al D8). One job per toolchain (ADR 30.9.26am): each builds its
# kit, runs its unit tests and lint, checks its generated code, builds its
# snippets and runs the conformance host against its fixture app. Every job
# installs Rust too, because the conformance host is Rust.

on:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Publishable, coverage, tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # check-publishable needs every kit's codegen toolchain.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: ruby
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer

      - name: The view, every kit's generated code, the library floor, languages.toml
        run: make check-publishable

      - name: Every app operation and behaviour has a case; every kit a fixture app
        run: make check-conformance-coverage

      - name: The tools' own tests
        run: make test-tools

  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: make check-codegen-typescript
      - name: Lint, types, tests, build, package checks, snippets
        run: make test-typescript
      - run: make conformance-typescript

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config
      - run: make check-codegen-rust
      - name: Clippy, tests with and without axum, xtask, snippets
        run: make test-rust
      - run: make conformance-rust

  go:
    name: Go ${{ matrix.go }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.23', stable]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - run: make check-codegen-go
      - name: gofmt, vet, tests, snippets
        run: make test-go
      - run: make conformance-go
      # golangci-lint v2 needs Go 1.24 or newer to build.
      - if: matrix.go == 'stable'
        run: make lint-go

  jvm:
    name: Java and Kotlin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: make check-codegen-java check-codegen-kotlin
      - name: Spotless, Checkstyle, ktlint, tests, AppsCodegen, snippets
        run: make test-java test-kotlin
      - run: make conformance-java conformance-kotlin

  ruby:
    name: Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.3', ruby]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # check-codegen-ruby runs openapi-generator through the Gradle :codegen project.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          working-directory: ruby
      - run: make check-codegen-ruby
      - name: Tests, rubocop, signatures, snippets
        run: make test-ruby
      - run: make conformance-ruby

  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
      - run: composer validate --strict --working-dir=php
      - run: make check-codegen-php
      - name: phpunit, phpstan, budgets, snippets
        run: make test-php
      # Both PSR-7 implementations: nyholm, then guzzle.
      - run: make conformance-php
