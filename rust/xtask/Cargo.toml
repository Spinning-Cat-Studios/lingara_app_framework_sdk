[package]
name = "lingara-apps-xtask"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false
description = "Generates the lingara-apps crate's models, unions and operations from the app view"

# The clients' xtask pins (ADR 29.9.26p D2), so both crates read a view the
# same way.
[dependencies]
prettyplease = "0.2"
proc-macro2 = "1"
quote = "1"
schemars = "0.8"
serde_json = "1"
syn = { version = "2", features = ["full"] }
typify = { version = "0.8", default-features = false }
