# Every JVM pin, once (ADR 30.9.26am D1, D2, D6, D8). The openapi-generator
# pin serves Java, Kotlin, Ruby and PHP alike, so an upgrade is one line here
# and one check-codegen diff per language to review together. The pins are
# the client libraries' own, so a kit and its library are built alike.

[versions]
# The library each kit depends on. It is also LIBRARY_FLOOR, which
# tools/library-floor/check.sh holds equal to the literal in java/ and kotlin/
# build files; this entry is for the snippet and conformance projects.
lingara = "0.1.0-alpha.10"
# What lingara-java carries (its `api` dependency), pinned here for :codegen
# only: the kit itself takes Jackson through the library, never directly.
jackson = "2.22.3"
junit = "5.14.4"
openapi-generator = "7.14.0"
spotless = "8.10.3"
google-java-format = "1.28.0"
checkstyle = "10.26.1"
# Maven Central publishing through the Central Portal API.
maven-publish = "0.37.0"
# Kotlin. The Kotlin Gradle plugin pins the compiler.
kotlin = "2.4.10"
# The kotlin-stdlib the published POM declares: the apiVersion's, not the
# compiler's, so a caller's Kotlin 2.2 compiler can read it.
kotlin-stdlib-floor = "2.2.0"
kotlinx-serialization = "1.10.0"
kotlinx-coroutines = "1.10.2"
ktlint = "1.7.1"
# Ktor 3: compileOnly in :kotlin (D1), so it never reaches the POM; the
# conformance fixture and the route test bring their own.
ktor = "3.6.0"

[libraries]
lingara-java = { module = "com.getlingara:lingara-java", version.ref = "lingara" }
lingara-kotlin = { module = "com.getlingara:lingara-kotlin", version.ref = "lingara" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
spotless-plugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }
maven-publish-plugin = { module = "com.vanniktech:gradle-maven-publish-plugin", version.ref = "maven-publish" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-serialization-plugin = { module = "org.jetbrains.kotlin:kotlin-serialization", version.ref = "kotlin" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-cio = { module = "io.ktor:ktor-server-cio", version.ref = "ktor" }
ktor-server-test-host = { module = "io.ktor:ktor-server-test-host", version.ref = "ktor" }

[plugins]
openapi-generator = { id = "org.openapi.generator", version.ref = "openapi-generator" }
