# One RuboCop pass for the kit's hand-written Ruby: standard's style (its
# base config, at the library's standard pin), then the size and complexity
# budgets at the library's numbers (lingara_api_clients' .rubocop-budgets.yml,
# ADR 29.9.26t D7), which standard turns off. Generated files are
# openapi-generator's and ruby/codegen's, reviewed as codegen diffs.
inherit_gem:
  standard: config/base.yml

AllCops:
  NewCops: disable
  SuggestExtensions: false
  TargetRubyVersion: 3.3
  # Setting Exclude replaces RuboCop's defaults, vendor/** among them.
  Exclude:
    - "vendor/**/*"
    - "lib/lingara/apps/generated/**/*"
    - "lib/lingara/apps/unions.rb"
    - "lib/lingara/apps/operations.rb"
    - "lib/lingara/apps/version.rb"

# Keyword options are Ruby's spelling of functional options, so a keyword
# list is not a parameter list.
Metrics/ParameterLists:
  Enabled: true
  Max: 5
  CountKeywordArgs: false

Metrics/MethodLength:
  Enabled: true
  Max: 50

Metrics/CyclomaticComplexity:
  Enabled: true
  Max: 10

Metrics/ClassLength:
  Enabled: true
  Max: 600

Metrics/ModuleLength:
  Enabled: true
  Max: 600
